services:
  openkb:
    build:
      context: .
    image: openkb:latest
    ports:
      - "7566:7566"
    environment:
      # Your LLM gateway (any OpenAI-compatible / LiteLLM provider).
      - LLM_API_KEY=${LLM_API_KEY:-sk-4551db1cb0094b3e-2cd0bd-f502824a}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://open-claude.dainn.online/v1}
      # Model used for NEW KBs (the /init endpoint and openkb-init); the
      # KB-level config.yaml wins per KB. `openai/` prefix is required so
      # LiteLLM routes cx/* to the OpenAI-compatible base above.
      - OPENKB_MODEL=${OPENKB_MODEL:-openai/cx/gpt-5.6-sol}
      # The open-claude.dainn.online gateway blocks the official OpenAI SDK
      # User-Agent; override it on every LLM request for new KBs.
      - OPENKB_EXTRA_HEADERS=${OPENKB_EXTRA_HEADERS:-{"User-Agent":"python-urllib/3.12"}}
      # Require a bearer token when the server is exposed publicly.
      # - OPENKB_API_TOKEN=${OPENKB_API_TOKEN:-}
      # Google Drive connector (optional). Enable Drive API in Google Cloud
      # Console, create an OAuth web client, and add the redirect URI
      # http://localhost:7566/api/v1/connectors/gdrive/oauth/callback
      # (or your public origin). For Docker-only sync, share a Drive folder
      # with a service-account email and paste the JSON key in the Workbench.
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:7566/api/v1/connectors/gdrive/oauth/callback}
    volumes:
      # Your knowledge base lives on the host; the entrypoint auto-registers it
      # (see docker/entrypoint.sh) so the Web UI lists it as KB "huggies".
      - ${OPENKB_KB_DIR:-C:\Users\hoang\Projects\iris-wiki\huggies}:/work
      # Persist the global config (~/.config/openkb: global.yaml, .env, KB
      # registry) on the HOST so settings like images_enabled / model defaults
      # survive container rebuilds and image swaps instead of resetting to
      # factory defaults every `docker compose up --build`.
      - ${OPENKB_CONFIG_DIR:-C:\Users\hoang\.config\openkb}:/root/.config/openkb
    restart: unless-stopped

# No named volume: the KB and global config are bind-mounted from host folders.